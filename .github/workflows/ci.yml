name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt matplotlib pypdf
      - name: Validate skill bundle
        run: python scripts/validate_skills.py
      - name: Fetch and validate presentation study data
        run: |
          python scripts/fetch_study_data.py
          python scripts/validate_presentation_study.py
      - name: Check README and docs links
        run: python scripts/check_links.py
      - name: Unit tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
